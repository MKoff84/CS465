<div class="container mt-4">

  <h1 class="mb-4">Travlr Getaways Administration</h1>

  <nav class="mb-4">
    <a class="btn btn-primary me-2" routerLink="/">
      View Trips
    </a>

    @if (authService.isLoggedIn()) {
      <a class="btn btn-success me-2" routerLink="/add-trip">
        Add New Trip
      </a>

      <button
        type="button"
        class="btn btn-outline-danger"
        (click)="logout()">
        Logout
      </button>
    } @else {
      <a class="btn btn-outline-primary" routerLink="/login">
        Administrator Login
      </a>
    }
  </nav>

  <router-outlet></router-outlet>

</div>

<div class="container mt-4">
  <h2 class="mb-4">Edit Trip</h2>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div *ngIf="!trip && !errorMessage" class="alert alert-info">
    Loading trip information...
  </div>

  <form
    *ngIf="trip"
    #tripForm="ngForm"
    (ngSubmit)="onSubmit()">

    <div class="mb-3">
      <label for="code" class="form-label">Trip Code</label>
      <input
        type="text"
        class="form-control"
        id="code"
        name="code"
        [(ngModel)]="trip.code"
        readonly>
    </div>

    <div class="mb-3">
      <label for="name" class="form-label">Trip Name</label>
      <input
        type="text"
        class="form-control"
        id="name"
        name="name"
        [(ngModel)]="trip.name"
        required>
    </div>

    <div class="mb-3">
      <label for="length" class="form-label">Duration</label>
      <input
        type="text"
        class="form-control"
        id="length"
        name="length"
        [(ngModel)]="trip.length"
        required>
    </div>

    <div class="mb-3">
      <label for="start" class="form-label">Start Date</label>
      <input
        type="date"
        class="form-control"
        id="start"
        name="start"
        [(ngModel)]="trip.start"
        required>
    </div>

    <div class="mb-3">
      <label for="resort" class="form-label">Resort</label>
      <input
        type="text"
        class="form-control"
        id="resort"
        name="resort"
        [(ngModel)]="trip.resort"
        required>
    </div>

    <div class="mb-3">
      <label for="perPerson" class="form-label">
        Price Per Person
      </label>
      <input
        type="number"
        class="form-control"
        id="perPerson"
        name="perPerson"
        [(ngModel)]="trip.perPerson"
        min="0"
        step="0.01"
        required>
    </div>

    <div class="mb-3">
      <label for="image" class="form-label">Image Filename</label>
      <input
        type="text"
        class="form-control"
        id="image"
        name="image"
        [(ngModel)]="trip.image"
        required>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">
        Description
      </label>
      <textarea
        class="form-control"
        id="description"
        name="description"
        rows="4"
        [(ngModel)]="trip.description"
        required></textarea>
    </div>

    <button
      type="submit"
      class="btn btn-primary me-2"
      [disabled]="tripForm.invalid || isSaving">
      {{ isSaving ? 'Saving...' : 'Update Trip' }}
    </button>

    <a href="/" class="btn btn-secondary">
      Cancel
    </a>

  </form>
</div>
